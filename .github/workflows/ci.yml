name: CI

on:
  push:
    branches:
      - main
    tags:
      # CI on any tag starting with the format "YYYY.N.N"
      - "[0-9][0-9][0-9][0-9].[0-9]+.[0-9]+*"
  pull_request:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_COLOR: 1
  RUFF_OUTPUT_FORMAT: github
  # without this, `uv sync` and `uv run` follow `.python-version` (3.11)
  UV_PYTHON: "3.14"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pre-commit hooks
        run: uv run prek run --all-files --show-diff-on-failure
