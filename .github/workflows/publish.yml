name: "Publish"

on:
  push:
    tags:
      # Publish on any tag starting with the format "YYYY.N.N"
      - "[0-9][0-9][0-9][0-9].[0-9]+.[0-9]+*"
  # dispatched on the new tag by the "Upgrade Font Awesome" workflow, because its tag push
  # (made with GITHUB_TOKEN) does not trigger other workflows
  workflow_dispatch:

jobs:
  # never publish a release that fails linting, type checking or tests
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    needs: [ci, test]
    # only publish tagged releases, also when dispatched manually
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      # without this, the smoke tests' `uv run` follows `.python-version` (3.11)
      UV_PYTHON: "3.14"
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build
        run: uv build

      # Check that basic features work and we didn't miss to include crucial files
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl --with pytest pytest -c /dev/null tests/smoke_test.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz --with pytest pytest -c /dev/null tests/smoke_test.py

      - name: Publish
        run: uv publish
